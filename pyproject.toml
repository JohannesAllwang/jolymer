[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "jolymer"
version = "0.0.2"

authors = [
    { name = "Johannes Allwang", email = "johannes@it-allwang.de" }
]

description = "Package for data analysis"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent"
]

dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "PyQt6",
    "MDAnalysis",
    "pyFAI",
    "sasview",
    "mdtraj",
    "pyqtgraph",
    "sasmodels",
]

[project.scripts]
jolymer-regals = "jolymer.gui.regals.app:main"
jolymer-secplot = "jolymer.gui.sec_plot.app:main"


[tool.setuptools.packages.find]
where = ["src"]


[tool.setuptools.package-data]
jolymer = [
    "data/**/*"
]
